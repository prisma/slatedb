# crossbeam-skiplist 0.1.3 as published on crates.io (its normalized manifest), vendored by
# SlateDB's fork for the finger insert. See README.md. The empty `[workspace]` keeps it out of
# any enclosing workspace when it is built on its own.

[workspace]

[package]
edition = "2021"
rust-version = "1.61"
name = "crossbeam-skiplist"
version = "0.1.3+slatedb.1"
description = "A concurrent skip list"
homepage = "https://github.com/crossbeam-rs/crossbeam/tree/master/crossbeam-skiplist"
readme = "README.md"
keywords = [
    "map",
    "set",
    "skiplist",
    "lock-free",
]
categories = [
    "algorithms",
    "concurrency",
    "data-structures",
    "no-std",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/crossbeam-rs/crossbeam"

[dependencies.crossbeam-epoch]
version = "0.9.17"
default-features = false

[dependencies.crossbeam-utils]
version = "0.8.18"
default-features = false

[dev-dependencies.rand]
version = "0.8"

[features]
alloc = ["crossbeam-epoch/alloc"]
default = ["std"]
std = [
    "alloc",
    "crossbeam-epoch/std",
    "crossbeam-utils/std",
]

[lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"
unreachable_pub = "warn"
